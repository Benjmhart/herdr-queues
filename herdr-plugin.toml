id = "benjmhart.queues"
name = "Queues"
version = "0.31.0"
min_herdr_version = "0.9.3"
description = "Your own queues (personal, work, ...) of the agents waiting on you, on every machine; Enter jumps there"
platforms = ["linux", "macos"]

# The working spinner (`spinner on`, `mark own`); exits at once when one already runs.
[[startup]]
command = ["python3", "queues.py", "spin"]

# Labels follow at once, not in the watcher's minute: a new agent, a renamed workspace (and herdr-machine-icons'
# icon, which lands with the agent).
[[events]]
on = "pane.agent_detected"
command = ["python3", "queues.py", "refresh"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "queues.py", "refresh"]

# Heading entries (experimental): a click on one toggles its queue.
[[events]]
on = "pane.focused"
command = ["python3", "queues.py", "focused"]

[[events]]
on = "workspace.renamed"
command = ["python3", "queues.py", "refresh"]

[[actions]]
id = "open"
title = "Agent queues"
command = ["python3", "queues.py", "open"]

[[panes]]
id = "ui"
title = "Agent queues"
placement = "popup"
width = "95%"
height = "95%"
command = ["python3", "queues.py", "ui"]
